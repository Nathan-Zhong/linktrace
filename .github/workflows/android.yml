name: Build Android APK
# Linktrace Android verification: debug build only, no signing, no release.
# The debug APK is kept as an Actions artifact for inspection.

on:
  push:
    branches: [main, import/upstream-v2.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version (versionName = dev, versionCode = commit count + 1000)
        run: |
          echo "BUILD=$(( $(git rev-list --count HEAD) + 1000 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        env:
          ATLAS_BUILD: ${{ env.BUILD }}
          ATLAS_VERSION: dev
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          ls -la app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Linktrace-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
